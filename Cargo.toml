[workspace]
resolver = "2"
members = [
    "crates/leaf-core",
    "crates/leaf-db",
    "crates/leaf-watcher",
    "crates/leaf-agent",
    "crates/leaf-executor",
    "crates/leaf-mcp",
    "crates/leaf-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LEAF Contributors"]
license = "MIT"
repository = "https://github.com/leaf-rs/leaf-rs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File watching
notify = "6"
globset = "0.4"

# MIME type detection
mime_guess = "2"

# OS paths
dirs = "5"

# Tauri
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Internal crates
leaf-core = { path = "crates/leaf-core" }
leaf-db = { path = "crates/leaf-db" }
leaf-watcher = { path = "crates/leaf-watcher" }
leaf-agent = { path = "crates/leaf-agent" }
leaf-executor = { path = "crates/leaf-executor" }
leaf-mcp = { path = "crates/leaf-mcp" }
